name: System Monitoring

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        run: |
          if [ -f state.db.b64 ]; then
            base64 -d state.db.b64 > state.db
          fi

      - name: Run monitoring agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          TARGET_NICHE: ${{ secrets.TARGET_NICHE }}
          TARGET_CITY: ${{ secrets.TARGET_CITY }}
          TARGET_STATE: ${{ secrets.TARGET_STATE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
          OUTREACH_FROM_NAME: ${{ secrets.OUTREACH_FROM_NAME }}
        run: python main.py run --agent monitor
